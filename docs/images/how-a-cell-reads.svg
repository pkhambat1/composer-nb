<svg xmlns="http://www.w3.org/2000/svg" width="980" height="528" viewBox="0 0 980 528" role="img"><title>How a cell reads: settings, typed names, instrument lines and play</title><style>
.card{fill:#ffffff;stroke:#e0e0e0}
.code{fill:#f5f5f5}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;fill:#1a1a1a}
.h{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;fill:#1a1a1a}
.dim{fill:#585858} .mute{fill:#8a8a8a}
.kw{fill:#6f42c1;font-weight:600} .val{fill:#032f62} .inst{fill:#005cc5;font-weight:700}
.word{fill:#8a4cd4} .step{fill:#1f8a5b} .com{fill:#8a8a8a;font-style:italic} .p{fill:#999}
.root{fill:#1a1a1a;font-weight:600} .ext{fill:#d97706} .bar{fill:#c5c5c5}
.wire{stroke:#c9d4e3;stroke-width:1.5;fill:none} .dot{fill:#1a73e8}
.cell{fill:#ececec} .alt{fill:#e1e7f0} .hit{fill:#1a73e8} .soft{fill:#8ab4f8}
.rule{stroke:#1a1a1a;stroke-width:2} .grid{stroke:#d0d0d0;stroke-width:1}
.brace{stroke:#1a73e8;stroke-width:2;fill:none} .accent{fill:#1a73e8}
@media (prefers-color-scheme: dark) {
.card{fill:#21252b;stroke:#353b46} .code{fill:#1b1e23}
.s,.h{fill:#e1e4e8} .dim{fill:#aab1bf} .mute{fill:#7c828c}
.kw{fill:#c792ea} .val{fill:#9ecbff} .inst{fill:#82aaff} .word{fill:#d39bff}
.step{fill:#80e7b3} .com{fill:#6b7280} .p{fill:#6b7280} .root{fill:#e1e4e8}
.ext{fill:#ffcb6b} .bar{fill:#4a5163} .wire{stroke:#3d4656} .dot{fill:#7eb6ff}
.cell{fill:#2c313a} .alt{fill:#343c4a} .hit{fill:#4f8fea} .soft{fill:#2f5f9e}
.rule{stroke:#e1e4e8} .grid{stroke:#3d4656} .brace{stroke:#7eb6ff} .accent{fill:#7eb6ff}
}
</style><rect class="card" x="0.5" y="0.5" width="979" height="527" rx="14"/><text class="h" x="28" y="44">How a cell reads</text><text class="s dim" x="28" y="68">Every line starts by saying what it is.</text><rect class="code" x="24" y="102" width="360" height="392" rx="10"/><text class="m" x="44" y="128" xml:space="preserve"><tspan class="com">// hotel california, with a beat</tspan></text><text class="m" x="44" y="155" xml:space="preserve"><tspan class="kw">tempo</tspan> <tspan class="val">75</tspan></text><circle class="dot" cx="129.2" cy="150" r="3.5"/><path class="wire" d="M134.2 150 H406"/><text class="s" x="420" y="155"><tspan font-weight="700">A setting</tspan><tspan class="dim">: a reserved word, then its value</tspan></text><text class="m" x="44" y="182" xml:space="preserve"><tspan class="kw">capo</tspan> <tspan class="val">2</tspan></text><text class="m" x="44" y="209" xml:space="preserve"></text><text class="m" x="44" y="236" xml:space="preserve"><tspan class="kw">pattern</tspan> <tspan class="word">beat</tspan><tspan class="p"> = {</tspan></text><circle class="dot" cx="201.5" cy="231" r="3.5"/><path class="wire" d="M206.5 231 H406"/><text class="s" x="420" y="236"><tspan font-weight="700">A name</tspan><tspan class="dim">: its type in front, = to give it a value</tspan></text><text class="m" x="44" y="263" xml:space="preserve">  <tspan class="inst">kick</tspan><tspan class="p">: </tspan><tspan class="step">1 3&amp;</tspan></text><circle class="dot" cx="165.4" cy="258" r="3.5"/><path class="wire" d="M170.4 258 H406"/><text class="s" x="420" y="263"><tspan font-weight="700">A drum</tspan><tspan class="dim">: the beats it hits on</tspan></text><text class="m" x="44" y="290" xml:space="preserve">  <tspan class="inst">snare</tspan><tspan class="p">: </tspan><tspan class="step">2 4</tspan></text><text class="m" x="44" y="317" xml:space="preserve">  <tspan class="inst">hat</tspan><tspan class="p">: </tspan><tspan class="step">x-</tspan></text><circle class="dot" cx="138.3" cy="312" r="3.5"/><path class="wire" d="M143.3 312 H406"/><text class="s" x="420" y="317"><tspan font-weight="700">Or steps</tspan><tspan class="dim">: x is a hit and - a rest, repeating</tspan></text><text class="m" x="44" y="344" xml:space="preserve"><tspan class="p">}</tspan></text><text class="m" x="44" y="371" xml:space="preserve"></text><text class="m" x="44" y="398" xml:space="preserve"><tspan class="kw">play</tspan><tspan class="p"> {</tspan></text><circle class="dot" cx="111.2" cy="393" r="3.5"/><path class="wire" d="M116.2 393 H406"/><text class="s" x="420" y="398"><tspan font-weight="700">play makes the sound</tspan><tspan class="dim">: what&#x27;s in its braces plays together</tspan></text><text class="m" x="44" y="425" xml:space="preserve">  <tspan class="inst">guitar</tspan><tspan class="p">: </tspan><tspan class="kw">chords</tspan> <tspan class="root">A</tspan><tspan class="word">m</tspan> <tspan class="root">E</tspan><tspan class="ext">7</tspan><tspan class="bar">|</tspan><tspan class="root">G D</tspan></text><circle class="dot" cx="291.8" cy="420" r="3.5"/><path class="wire" d="M296.8 420 H406"/><text class="s" x="420" y="425"><tspan font-weight="700">An instrument and its chords</tspan><tspan class="dim">: | between bars</tspan></text><text class="m" x="44" y="452" xml:space="preserve">  <tspan class="word">beat</tspan></text><circle class="dot" cx="111.2" cy="447" r="3.5"/><path class="wire" d="M116.2 447 H406"/><text class="s" x="420" y="452"><tspan font-weight="700">A pattern on its own line</tspan><tspan class="dim">: repeats until the play ends</tspan></text><text class="m" x="44" y="479" xml:space="preserve"><tspan class="p">}</tspan></text></svg>
