<svg xmlns="http://www.w3.org/2000/svg" width="968" height="284" viewBox="0 0 968 284" role="img"><title>The step characters x, ^, ~, d and - as an ordinary note, an accent, a ghost note, a double stroke and a rest</title><style>
.card{fill:#ffffff;stroke:#e0e0e0}
.code{fill:#f5f5f5}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:15px}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;fill:#1a1a1a}
.h{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;fill:#1a1a1a}
.dim{fill:#585858} .mute{fill:#8a8a8a}
.kw{fill:#6f42c1;font-weight:600} .val{fill:#032f62} .inst{fill:#005cc5;font-weight:700}
.word{fill:#8a4cd4} .step{fill:#1f8a5b} .com{fill:#8a8a8a;font-style:italic} .p{fill:#999}
.root{fill:#1a1a1a;font-weight:600} .ext{fill:#d97706} .bar{fill:#c5c5c5}
.wire{stroke:#c9d4e3;stroke-width:1.5;fill:none} .dot{fill:#1a73e8}
.cell{fill:#ececec} .alt{fill:#e1e7f0} .hit{fill:#1a73e8} .soft{fill:#8ab4f8}
.rule{stroke:#1a1a1a;stroke-width:2} .grid{stroke:#d0d0d0;stroke-width:1}
.brace{stroke:#1a73e8;stroke-width:2;fill:none} .accent{fill:#1a73e8}
.ink{fill:#1a1a1a} .pen{stroke:#1a1a1a;fill:none;stroke-linecap:round} .staff{stroke:#8a8a8a;stroke-width:1}
@media (prefers-color-scheme: dark) {
.card{fill:#21252b;stroke:#353b46} .code{fill:#1b1e23}
.s,.h{fill:#e1e4e8} .dim{fill:#aab1bf} .mute{fill:#7c828c}
.kw{fill:#c792ea} .val{fill:#9ecbff} .inst{fill:#82aaff} .word{fill:#d39bff}
.step{fill:#80e7b3} .com{fill:#6b7280} .p{fill:#6b7280} .root{fill:#e1e4e8}
.ext{fill:#ffcb6b} .bar{fill:#4a5163} .wire{stroke:#3d4656} .dot{fill:#7eb6ff}
.cell{fill:#2c313a} .alt{fill:#343c4a} .hit{fill:#4f8fea} .soft{fill:#2f5f9e}
.rule{stroke:#e1e4e8} .ink{fill:#e1e4e8} .pen{stroke:#e1e4e8} .staff{stroke:#7c828c} .grid{stroke:#3d4656} .brace{stroke:#7eb6ff} .accent{fill:#7eb6ff}
}
</style><rect class="card" x="0.5" y="0.5" width="967" height="283" rx="14"/><text class="h" x="28" y="44">What each step character is on the page</text><text class="s dim" x="28" y="68">Shown on a tom line. Every character lasts one sixteenth note.</text><path class="staff" d="M28 138 H940"/><path class="staff" d="M28 150 H940"/><path class="staff" d="M28 162 H940"/><path class="staff" d="M28 174 H940"/><path class="staff" d="M28 186 H940"/><rect class="ink" x="40" y="150" width="4" height="24"/><rect class="ink" x="48" y="150" width="4" height="24"/><path class="staff" d="M28 138 V186 M940 138 V186"/><ellipse class="ink" cx="150" cy="144.0" rx="7" ry="5" transform="rotate(-20 150 144.0)"/><path class="pen" stroke-width="1.6" d="M156.3 143.0 V106.0"/><text class="m step" x="150" y="240" text-anchor="middle" style="font-size:20px;font-weight:700">x</text><text class="s dim" x="150" y="260" text-anchor="middle" style="font-size:13px">normal hit</text><ellipse class="ink" cx="320" cy="144.0" rx="7" ry="5" transform="rotate(-20 320 144.0)"/><path class="pen" stroke-width="1.6" d="M326.3 143.0 V106.0"/><path class="pen" stroke-width="1.8" d="M314 90.0 L326 94.0 L314 98.0"/><text class="m step" x="320" y="240" text-anchor="middle" style="font-size:20px;font-weight:700">^</text><text class="s dim" x="320" y="260" text-anchor="middle" style="font-size:13px">accent</text><ellipse class="ink" cx="490" cy="144.0" rx="7" ry="5" transform="rotate(-20 490 144.0)"/><path class="pen" stroke-width="1.6" d="M496.3 143.0 V106.0"/><path class="pen" stroke-width="1.6" d="M479 136.0 Q474 144.0 479 152.0"/><path class="pen" stroke-width="1.6" d="M501 136.0 Q506 144.0 501 152.0"/><text class="m step" x="490" y="240" text-anchor="middle" style="font-size:20px;font-weight:700">~</text><text class="s dim" x="490" y="260" text-anchor="middle" style="font-size:13px">ghost note</text><ellipse class="ink" cx="660" cy="144.0" rx="7" ry="5" transform="rotate(-20 660 144.0)"/><path class="pen" stroke-width="1.6" d="M666.3 143.0 V106.0"/><path class="pen" stroke-width="2.4" d="M660 126.0 L673 119.0"/><text class="m step" x="660" y="240" text-anchor="middle" style="font-size:20px;font-weight:700">d</text><text class="s dim" x="660" y="260" text-anchor="middle" style="font-size:13px">double stroke</text><path class="pen" stroke-width="1.8" d="M835 150 L827 176"/><circle class="ink" cx="825" cy="153" r="2.6"/><path class="pen" stroke-width="1.6" d="M825 155 Q830 156 834.0 151"/><circle class="ink" cx="825" cy="162" r="2.6"/><path class="pen" stroke-width="1.6" d="M825 164 Q830 165 831.2 160"/><text class="m step" x="830" y="240" text-anchor="middle" style="font-size:20px;font-weight:700">-</text><text class="s dim" x="830" y="260" text-anchor="middle" style="font-size:13px">nothing (a rest)</text></svg>
