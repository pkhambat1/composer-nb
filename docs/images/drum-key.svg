r="middle" style="font-size:13px">hat</text><path class="pen" stroke-width="2" d="M458.5 120.5 L469.5 131.5 M458.5 131.5 L469.5 120.5"/><path class="pen" stroke-width="1.6" d="M470.3 125.0 V88.0"/><circle class="pen" stroke-width="1.6" cx="464" cy="76.0" r="4.5"/><text class="m inst" x="464" y="260" text-anchor="middle" style="font-size:13px">hat.open</text><path class="pen" stroke-width="2" d="M530.5 180.5 L541.5 191.5 M530.5 191.5 L541.5 180.5"/><path class="pen" stroke-width="1.6" d="M542.3 185.0 V148.0"/><text class="m inst" x="536" y="236" text-anchor="middle" style="font-size:13px">hat.pedal</text><path class="pen" stroke-width="2" d="M602.5 126.5 L613.5 137.5 M602.5 137.5 L613.5 126.5"/><path class="pen" stroke-width="1.6" d="M614.3 131.0 V94.0"/><text class="m inst" x="608" y="260" text-anchor="middle" style="font-size:13px">ride</text><path class="ink" d="M673 132.0 L680 125.5 L687 132.0 L680 138.5 Z"/><path class="pen" stroke-width="1.6" d="M686.3 131.0 V94.0"/><text class="m inst" x="680" y="236" text-anchor="middle" style="font-size:13px">ride.bell</text><path class="staff" d="M740 120.0 H764"/><path class="pen" stroke-width="2" d="M746.5 114.5 L757.5 125.5 M746.5 125.5 L757.5 114.5"/><path class="pen" stroke-width="1.6" d="M758.3 119.0 V82.0"/><text class="m inst" x="752" y="260" text-anchor="middle" style="font-size:13px">crash</text><ellipse class="ink" cx="824" cy="138.0" rx="7" ry="5" transform="rotate(-20 824 138.0)"/><path class="pen" stroke-width="1.6" d="M830.3 137.0 V100.0"/><text class="m inst" x="824" y="236" text-anchor="middle" style="font-size:13px">tom</text><ellipse class="ink" cx="896" cy="162.0" rx="7" ry="5" transform="rotate(-20 896 162.0)"/><path class="pen" stroke-width="1.6" d="M902.3 161.0 V124.0"/><text class="m inst" x="896" y="260" text-anchor="middle" style="font-size:13px">floor</text></svg>
