<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Composer.nb — Music Composer Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600&family=JetBrains+Mono:wght@400;500;600&family=Fira+Code:wght@400;500;600&family=Source+Code+Pro:wght@400;500;600&family=VT323&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f7f7f7;
  --paper: #ffffff;
  --border: #e0e0e0;
  --border-soft: #ededed;
  --text: #1a1a1a;
  --text-dim: #585858;
  --text-mute: #8a8a8a;
  --accent: #1a73e8;
  --accent-soft: #e6f0fd;
  --accent-prompt: #303f9f;
  --out-prompt: #b00020;
  --selected-bar: var(--accent);
  --editing-bar: #2e7d32;
  --busy-bar: #f57c00;
  --code-bg: #f5f5f5;
  --pill-bg: #f0f0f0;
  --pill-fg: #444;
  --tb-bg: #fafafa;
  --tb-btn-hover: #ececec;
  --tb-btn-active: #e0e0e0;
  --kernel-idle: #5cb85c;
  --kernel-busy: #f0ad4e;
  --traceback: #b00020;
  --header-bg: #ffffff;
  --header-text: #424242;

  --tk-comment: #8a8a8a;
  --tk-directive-key: #6f42c1;
  --tk-directive-val: #032f62;
  --tk-bar: #c5c5c5;
  --tk-root-maj: #005cc5;
  --tk-root-min: #b00020;
  --tk-root-abs: #1a1a1a;
  --tk-quality: #8a4cd4;
  --tk-ext: #d97706;
  --tk-rhythm: #1f8a5b;
  --tk-rest: #888;
  --tk-slash: #999;
  --tk-bass: #444;
  --tk-error-bg: rgba(220, 38, 38, 0.18);

  --font-sans: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --font-serif: 'IBM Plex Serif', Georgia, serif;

  --cell-pad-x: 12px;
  --cell-pad-y: 4px;
  --code-pad-x: 10px;
  --code-pad-y: 8px;
}

[data-density="compact"] {
  --cell-pad-x: 8px;
  --cell-pad-y: 2px;
  --code-pad-x: 8px;
  --code-pad-y: 5px;
}

[data-theme="dark"] {
  --bg: #181a1f;
  --paper: #21252b;
  --border: #353b46;
  --border-soft: #2c313a;
  --text: #e1e4e8;
  --text-dim: #aab1bf;
  --text-mute: #7c828c;
  --accent: #7eb6ff;
  --accent-soft: #1d3050;
  --accent-prompt: #9dc4ff;
  --out-prompt: #ff8095;
  --code-bg: #1b1e23;
  --pill-bg: #2c313a;
  --pill-fg: #c5cad3;
  --tb-bg: #1c1f25;
  --tb-btn-hover: #2c313a;
  --tb-btn-active: #353b46;
  --kernel-idle: #56c270;
  --kernel-busy: #e8a44a;
  --traceback: #ff7b8b;
  --header-bg: #1c1f25;
  --header-text: #c5cad3;
  --editing-bar: #66c674;
  --busy-bar: #e8a44a;

  --tk-comment: #6b7280;
  --tk-directive-key: #c792ea;
  --tk-directive-val: #9ecbff;
  --tk-bar: #4a5163;
  --tk-root-maj: #82aaff;
  --tk-root-min: #ff8b8b;
  --tk-root-abs: #e1e4e8;
  --tk-quality: #d39bff;
  --tk-ext: #ffcb6b;
  --tk-rhythm: #80e7b3;
  --tk-rest: #7c828c;
  --tk-slash: #6b7280;
  --tk-bass: #aab1bf;
}

[data-theme="retro"] {
  --bg: #0a0a08;
  --paper: #110f08;
  --border: #3a2e15;
  --border-soft: #251d0d;
  --text: #ffb000;
  --text-dim: #b87800;
  --text-mute: #6e4900;
  --accent: #ffd566;
  --accent-soft: #2a1f08;
  --accent-prompt: #ffd566;
  --out-prompt: #ff8050;
  --code-bg: #1a140a;
  --pill-bg: #1f1808;
  --pill-fg: #ffd566;
  --tb-bg: #110f08;
  --tb-btn-hover: #1f1808;
  --tb-btn-active: #2a1f08;
  --kernel-idle: #6ee06e;
  --kernel-busy: #ff8533;
  --traceback: #ff5050;
  --header-bg: #110f08;
  --header-text: #ffb000;
  --editing-bar: #6ee06e;
  --busy-bar: #ff8533;

  --tk-comment: #8a6420;
  --tk-directive-key: #ffd566;
  --tk-directive-val: #ffb000;
  --tk-bar: #6e4900;
  --tk-root-maj: #ffd566;
  --tk-root-min: #ff8050;
  --tk-root-abs: #ffb000;
  --tk-quality: #ff8533;
  --tk-ext: #ffd566;
  --tk-rhythm: #6ee06e;
  --tk-rest: #8a6420;
  --tk-slash: #6e4900;
  --tk-bass: #b87800;

  --font-sans: 'VT323', 'IBM Plex Mono', monospace;
  --font-mono: 'VT323', 'IBM Plex Mono', monospace;
  --font-serif: 'VT323', 'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  font-feature-settings: 'kern' 1, 'liga' 1;
}
[data-theme="retro"] body { font-size: 18px; line-height: 1.3; text-shadow: 0 0 1px rgba(255,176,0,0.6); }

.nb-header {
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  padding: 8px 18px 0 18px;
}
.nb-header-left { display: flex; align-items: center; gap: 12px; padding-bottom: 6px; }
.nb-logo { width: 30px; height: 30px; display: grid; place-items: center; color: var(--accent); }
.nb-titles { display: flex; flex-direction: column; }
.nb-title {
  font-family: var(--font-serif);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--header-text);
  display: flex; align-items: baseline; gap: 1px;
}
.nb-title-sep { color: var(--text-mute); }
.nb-title-ext { color: var(--text-dim); font-weight: 400; }
.nb-subtitle { color: var(--text-mute); font-size: 11.5px; }
.nb-dim { opacity: 0.7; }

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 12px;
  background: var(--tb-bg);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 6px; }
.tb-group {
  display: flex; align-items: center;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--paper);
  overflow: hidden;
}
.tb-group + .tb-group { margin-left: 6px; }
.tb-btn {
  appearance: none; background: transparent;
  border: none; border-right: 1px solid var(--border-soft);
  color: var(--text-dim);
  padding: 5px 9px; font: inherit; font-size: 12px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
  height: 28px;
}
.tb-btn:last-child { border-right: none; }
.tb-btn:hover { background: var(--tb-btn-hover); color: var(--text); }
.tb-btn:active { background: var(--tb-btn-active); }
.tb-btn-primary { background: var(--accent); color: white; }
.tb-btn-primary:hover { background: var(--accent); filter: brightness(1.08); color: white; }
.tb-btn-danger:hover { color: var(--traceback); }
.tb-btn-theme { color: var(--text-dim); }
.tb-btn-theme:hover { color: var(--accent); }
.kernel-name { color: var(--text-dim); font-size: 12px; font-family: var(--font-mono); }
.kernel-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.kernel-idle { background: var(--kernel-idle); box-shadow: 0 0 6px var(--kernel-idle); }
.kernel-busy { background: var(--kernel-busy); box-shadow: 0 0 8px var(--kernel-busy); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

.nb-main {
  padding: 22px 18px 80px 18px;
  min-width: 0;
}
.cells {
  max-width: 1020px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
}

.cell {
  display: grid;
  grid-template-columns: 78px 1fr;
  margin: var(--cell-pad-y) 0;
  background: var(--paper);
  border: 1px solid transparent;
  border-radius: 2px;
  position: relative;
  transition: border-color 120ms ease;
}
.cell:hover { border-color: var(--border-soft); }
.cell-selected { border-color: var(--accent); box-shadow: -3px 0 0 0 var(--accent); }
.cell-editing.cell-selected { border-color: var(--editing-bar); box-shadow: -3px 0 0 0 var(--editing-bar); }
.cell-running.cell-selected { border-color: var(--busy-bar); box-shadow: -3px 0 0 0 var(--busy-bar); }

.cell-prompt {
  font-family: var(--font-mono);
  color: var(--accent-prompt);
  font-size: 12.5px;
  padding: 10px 8px 0 8px;
  text-align: right;
  user-select: none;
  letter-spacing: -0.01em;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}
.cell-run-btn {
  appearance: none;
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--paper);
  color: var(--text-mute);
  cursor: pointer;
  display: grid; place-items: center;
  padding: 0;
  opacity: 0;
  transition: opacity 120ms ease, color 120ms ease, border-color 120ms ease, background 120ms ease;
}
.cell:hover .cell-run-btn,
.cell-selected .cell-run-btn,
.cell-running .cell-run-btn { opacity: 1; }
.cell-run-btn:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.cell-run-btn:active { transform: scale(0.94); }
.cell-run-btn:disabled { cursor: default; color: var(--busy-bar); }
[data-theme="retro"] .cell-run-btn { border-color: var(--text-dim); }
.prompt-text { white-space: nowrap; }
.prompt-running { color: var(--busy-bar); animation: pulse 1.2s ease-in-out infinite; }

.cell-body { min-width: 0; padding: var(--cell-pad-y) var(--cell-pad-x) var(--cell-pad-y) 4px; position: relative; }

.md-preview-toggle {
  position: absolute;
  top: 6px;
  right: 8px;
  appearance: none;
  background: var(--paper);
  border: 1px solid var(--border);
  color: var(--text-mute);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  padding: 2px 8px;
  border-radius: 3px;
  cursor: pointer;
  z-index: 2;
  user-select: none;
  transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
}
.md-preview-toggle:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.md-preview-toggle-on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

.cell-menu-wrap {
  position: absolute;
  top: 6px;
  right: 8px;
  z-index: 5;
}
.cell-menu-btn {
  width: 22px; height: 22px;
  appearance: none;
  background: var(--paper);
  border: 1px solid var(--border);
  color: var(--text-mute);
  border-radius: 4px;
  cursor: pointer;
  display: grid; place-items: center;
  padding: 0;
  opacity: 0;
  transition: opacity 120ms ease, color 120ms ease, border-color 120ms ease, background 120ms ease;
}
.cell:hover .cell-menu-btn,
.cell-selected .cell-menu-btn { opacity: 1; }
.cell-menu-btn:hover { background: var(--tb-btn-hover); color: var(--text); border-color: var(--border); }
.cell-text.cell-editing .cell-menu-wrap { right: 86px; }

.cell-menu-dropdown {
  position: absolute;
  top: 26px;
  right: 0;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  padding: 4px;
  min-width: 140px;
  z-index: 10;
}
.cell-menu-item {
  appearance: none;
  background: transparent;
  border: none;
  color: var(--text);
  font: inherit;
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
}
.cell-menu-item:hover { background: var(--tb-btn-hover); }
.cell-menu-item-danger { color: var(--traceback); }
.cell-menu-item-danger:hover { background: rgba(176,0,32,0.06); }

.text-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  position: relative;
}
.text-area-split {
  border-right: 1px solid var(--border-soft);
  border-radius: 2px 0 0 2px;
}
.text-rendered-split {
  background: var(--paper);
  border: 1px solid var(--border-soft);
  border-radius: 0 2px 2px 0;
  padding: 8px 12px;
  overflow: auto;
  min-height: 72px;
}

.code-input {
  position: relative;
  background: var(--code-bg);
  border: 1px solid var(--border-soft);
  border-radius: 2px;
}
.code-hl, .code-area {
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.55;
  padding: var(--code-pad-y) var(--code-pad-x);
  margin: 0;
  border: none;
  white-space: pre-wrap;
  overflow-wrap: normal;
  word-break: normal;
  tab-size: 2;
}
[data-theme="retro"] .code-hl, [data-theme="retro"] .code-area { font-size: 17px; }
.code-hl {
  position: absolute; inset: 0;
  pointer-events: none;
  color: var(--text);
  overflow: hidden;
  background: transparent;
}
.code-area {
  position: relative;
  width: 100%;
  background: transparent;
  color: transparent;
  caret-color: var(--accent);
  outline: none;
  resize: none;
  overflow: hidden;
  display: block;
}
.code-area::selection { background: rgba(120, 160, 220, 0.35); color: transparent; }

.tk-comment { color: var(--tk-comment); font-style: italic; }
.tk-directive-key { color: var(--tk-directive-key); font-weight: 600; }
.tk-directive-val { color: var(--tk-directive-val); }
.tk-bar { color: var(--tk-bar); padding: 0 2px; }
.tk-root { color: var(--tk-root-abs); font-weight: 600; }
.tk-root-maj { color: var(--tk-root-maj); font-weight: 600; }
.tk-root-min { color: var(--tk-root-min); font-weight: 600; font-style: italic; }
.tk-root-abs { color: var(--tk-root-abs); font-weight: 600; }
.tk-quality { color: var(--tk-quality); font-weight: 500; }
.tk-ext { color: var(--tk-ext); font-weight: 500; }
.tk-rhythm { color: var(--tk-rhythm); }
.tk-rest { color: var(--tk-rest); }
.tk-slash { color: var(--tk-slash); }
.tk-bass { color: var(--tk-bass); }
.tk-error { background: var(--tk-error-bg); border-radius: 2px; box-shadow: 0 1px 0 var(--traceback); color: var(--traceback); }

.tk-drum-lane { color: var(--tk-directive-key); font-weight: 600; }
.tk-drum-sep { color: var(--text-mute); }
.tk-drum-hit { color: var(--tk-root-maj); font-weight: 700; }
.tk-drum-rest { color: var(--text-mute); opacity: 0.6; }

.cell-output {
  display: grid;
  grid-template-columns: 76px 1fr;
  margin-top: 6px;
}
.out-prompt {
  font-family: var(--font-mono);
  color: var(--out-prompt);
  font-size: 12.5px;
  text-align: right;
  padding: 8px 8px 0 0;
  user-select: none;
}
.out-content { min-width: 0; padding-right: 4px; }
.cell-output-error {
  display: block;
  background: rgba(176, 0, 32, 0.06);
  border-left: 3px solid var(--traceback);
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 12.5px;
}
.traceback { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.tb-name { color: var(--traceback); font-weight: 600; }
.tb-msg { color: var(--text); }
.tb-msg-block { display: flex; flex-direction: column; gap: 2px; }
.tb-msg-line { color: var(--text); }

.music-row { display: flex; align-items: center; gap: 10px; padding: 6px 6px 4px 6px; }
.music-row-controls { padding-top: 8px; }

.play-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--paper);
  color: var(--accent);
  cursor: pointer; display: grid; place-items: center;
  flex-shrink: 0; transition: all 120ms ease;
}
.play-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.play-btn.playing { background: var(--accent); color: white; border-color: var(--accent); }
.play-btn svg { fill: currentColor; }
[data-theme="retro"] .play-btn { border-color: var(--text); }
[data-theme="retro"] .play-btn.playing { background: var(--text); color: var(--bg); }

.waveform-wrap {
  flex: 1; position: relative; height: 50px;
}
.waveform { width: 100%; height: 100%; display: block; }

.out-controls-right { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  appearance: none; background: var(--paper);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font: inherit; font-size: 11px;
  padding: 4px 8px;
  border-radius: 3px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono);
}
.icon-btn:hover { background: var(--tb-btn-hover); color: var(--text); }

.playhead-track { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.playhead-bar {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: var(--accent);
  left: 0;
  animation: playhead linear forwards;
}
@keyframes playhead { from { left: 0%; } to { left: 100%; } }

.music-meta {
  display: flex; flex-direction: column; gap: 3px;
  font-family: var(--font-mono); font-size: 10.5px;
  color: var(--text-dim); text-align: right;
  min-width: 110px;
  align-self: center;
}
.meta-pill {
  background: var(--pill-bg); color: var(--pill-fg);
  padding: 1px 6px; border-radius: 2px;
  letter-spacing: 0.02em; display: inline-block;
}
.meta-pill-count { font-weight: 500; }
[data-theme="retro"] .meta-pill { font-size: 13px; }

.chord-strip {
  display: flex; gap: 4px;
  padding: 6px 6px 0 6px; flex-wrap: wrap;
}
.chord-chip {
  display: flex; flex-direction: column; gap: 3px;
  padding: 6px 8px 6px 8px;
  background: var(--pill-bg);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 11px;
  min-width: 120px;
  border-top: 2px solid transparent;
  position: relative;
  align-items: center;
}
.chord-label { font-weight: 600; color: var(--text); font-size: 12px; align-self: flex-start; }
.chord-notes { color: var(--text-mute); font-size: 9.5px; letter-spacing: -0.02em; word-break: break-all; align-self: flex-start; }
.chord-beats {
  position: absolute; top: 5px; right: 8px;
  color: var(--text-mute); font-size: 11px; line-height: 1;
}
[data-theme="retro"] .chord-label { font-size: 15px; }
[data-theme="retro"] .chord-notes { font-size: 13px; }

.chord-diagram { display: block; margin: 2px 0; }
.chord-diagram-piano rect { shape-rendering: crispEdges; }

.chord-chip-anim {
  animation: chordPulse ease forwards;
  animation-fill-mode: both;
}
@keyframes chordPulse {
  0%   { border-top-color: transparent; background: var(--pill-bg); }
  10%  { border-top-color: var(--accent); background: var(--accent-soft); }
  100% { border-top-color: transparent; background: var(--pill-bg); }
}

.parse-errors {
  margin-top: 8px;
  display: flex; gap: 8px;
  background: rgba(176, 0, 32, 0.06);
  border-left: 3px solid var(--traceback);
  padding: 6px 10px;
  font-family: var(--font-mono);
  font-size: 11.5px;
}
.pe-icon {
  width: 16px; height: 16px;
  background: var(--traceback);
  color: white;
  border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 700; font-size: 10px;
  flex-shrink: 0;
  margin-top: 1px;
}
.pe-list { display: flex; flex-direction: column; gap: 1px; }
.pe-line { color: var(--text-mute); padding-right: 8px; }
.pe-msg { color: var(--text); }

.text-area {
  width: 100%;
  background: var(--code-bg);
  border: 1px solid var(--border-soft);
  border-radius: 2px;
  resize: vertical;
  font-family: var(--font-mono);
  font-size: 13px; line-height: 1.55;
  color: var(--text);
  padding: 8px 10px;
  outline: none;
  min-height: 72px;
}
.text-rendered { padding: 4px 6px; cursor: text; }
