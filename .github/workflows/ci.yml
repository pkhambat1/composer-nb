name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Installs the package the way users get it (not editable), with the widget just built.
      - run: pip install build "./dsl[test]"
      - run: pytest dsl/tests/python
      - run: python -m build dsl
